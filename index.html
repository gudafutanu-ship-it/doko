<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声AIアシスタント</title>
    <style>
        /* 1. 黒い画面（画面全体がタッチエリア） */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            touch-action: manipulation;
        }
        #status {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #result {
            font-size: 18px;
            color: #aaaaaa;
            max-width: 400px;
        }
    </style>
</head>
<body onclick="startListening()">

    <div id="status">画面をタップして<br>話しかけてください</div>
    <div id="result"></div>

    <script>
        let isListening = false;

        // 2. 画面をタップすると音声認識がスタートする
        function startListening() {
            // iOSの音声合成/認識のブロック解除と重複起動防止
            if (isListening) return;

            // ブラウザの音声認識API（Web Speech API）の準備
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                document.getElementById('status').innerText = "このブラウザは音声認識に対応していません";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isListening = true;
                document.getElementById('status').innerText = "聞いています...";
                document.getElementById('result').innerText = "";
            };

            // 3. 話した言葉がテキストに変換されたとき
            recognition.onresult = async function(event) {
                const speechText = event.results[0][0].transcript;
                document.getElementById('status').innerText = `「${speechText}」`;
                document.getElementById('result').innerText = "考え中...";

                // 現在地を取得してAI（Cloudflare Workers）へ送信する処理へつなげる
                await sendToAI(speechText);
            };

            recognition.onerror = function(event) {
                document.getElementById('status').innerText = "もう一度画面をタップしてください";
                isListening = false;
            };

            recognition.onend = function() {
                isListening = false;
            };

            recognition.start();
        }

        // 4. 現在地と質問をCloudflare Workers（AI）に送る関数
        async function sendToAI(question) {
            if (!navigator.geolocation) {
                speak("位置情報が取得できません");
                return;
            }

            navigator.geolocation.getCurrentPosition(async function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                try {
                    // あなたのCloudflare WorkersのURL（AI応答用）
                    const workerUrl = `https:doko.gudafutanu.workers.dev/?lat=${lat}&lng=${lng}&q=${encodeURIComponent(question)}`;
                    
                    const res = await fetch(workerUrl);
                    const data = await res.json();
                    
                    // AIからの返答テキスト
                    const aiAnswer = data.answer || "お答えが見つかりませんでした。";
                    
                    document.getElementById('status').innerText = aiAnswer;
                    document.getElementById('result').innerText = "";

                    // 5. AirPodsへ音声読み上げ
                    speak(aiAnswer);

                } catch (e) {
                    const errMsg = "通信エラーが発生しました";
                    document.getElementById('status').innerText = errMsg;
                    speak(errMsg);
                }
            }, function(error) {
                speak("位置情報の取得に失敗しました");
            }, { timeout: 10000 });
        }

        // 音声合成（読み上げ）用関数
        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
