<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ここはどこ？</title>

  <!-- PWA & iOS ホーム画面追加用設定 -->
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ここどこ">
  
  <!-- アイコン（icon-512.png が無い場合のSVGダイナミックフォールバック付） -->
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="icon" type="image/png" href="icon-512.png">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #000000; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden; touch-action: manipulation;
    }
    #screen {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; text-align: center; cursor: pointer;
    }
    #uiContainer {
      opacity: 0; visibility: hidden; transition: opacity 0.3s ease; width: 100%;
    }
    body.active #uiContainer { opacity: 1; visibility: visible; }
    h1 { font-size: 2rem; margin: 0 0 10px 0; color: #007aff; }
    #status {
      font-size: 1.1rem; color: #34c759; max-width: 90vw; line-height: 1.5;
      background: rgba(255, 255, 255, 0.08); padding: 15px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15); word-break: break-all;
    }
    #hint { position: absolute; bottom: 30px; font-size: 0.85rem; color: #444444; }
  </style>
</head>
<body id="bodyTag">

  <div id="screen" onclick="handleTap()">
    <div id="uiContainer">
      <h1>ここはどこ？</h1>
      <div id="status">待機中...</div>
    </div>
    <div id="hint">画面のどこでもタップ</div>
  </div>

  <script>
    const GOOGLE_MAPS_API_KEY = "YOUR_GOOGLE_MAPS_API_KEY";
    let isBusy = false;

    // Service Worker の登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    function handleTap() {
      if (isBusy) return;
      isBusy = true;

      document.getElementById('bodyTag').classList.add('active');
      setStatus("GPS信号を取得中...");
      playBeep();

      if (!navigator.geolocation) {
        finishSession("エラー: GPS非対応");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          setStatus(`緯度:${lat.toFixed(4)}, 経度:${lng.toFixed(4)}\n住所を検索中...`);
          fetchAddress(lat, lng);
        },
        (error) => {
          let msg = "位置情報取得失敗";
          if (error.code === error.PERMISSION_DENIED) {
            msg = "拒否されました (code 1)\nSafariの設定を確認してください。";
          } else if (error.code === error.TIMEOUT) {
            msg = "GPSタイムアウト（屋外で再度お試しください）";
          }
          finishSession(msg);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function setStatus(text) {
      document.getElementById('status').innerText = text;
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e) {}
    }

    async function fetchAddress(lat, lng) {
      try {
        if (GOOGLE_MAPS_API_KEY && GOOGLE_MAPS_API_KEY !== "YOUR_GOOGLE_MAPS_API_KEY") {
          const res = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${GOOGLE_MAPS_API_KEY}&language=ja`);
          const data = await res.json();
          if (data.status === "OK" && data.results.length > 0) {
            const clean = data.results[0].formatted_address.replace(/^日本、?/, '').replace(/〒\d{3}-\d{4}\s?/, '');
            doneAndSpeak(`ここは、${clean} 付近です。`, clean);
            return;
          }
        }
        const res2 = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ja`);
        const data2 = await res2.json();
        const address = data2.display_name || "住所不明";
        doneAndSpeak(`ここは、${address} 付近です。`, address);
      } catch (e) {
        finishSession("通信エラーが発生しました");
      }
    }

    function doneAndSpeak(speechText, displayTxt) {
      setStatus(displayTxt);
      speakAndFadeOut(speechText);
    }

    function speakAndFadeOut(text) {
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP';
      uttr.rate = 1.05;
      uttr.onend = () => resetScreen();
      uttr.onerror = () => resetScreen();
      window.speechSynthesis.speak(uttr);
    }

    function finishSession(msg) {
      setStatus(msg);
      speakAndFadeOut(msg);
    }

    function resetScreen() {
      document.getElementById('bodyTag').classList.remove('active');
      isBusy = false;
    }
  </script>
</body>
</html>
